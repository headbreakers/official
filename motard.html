<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace Motard - Head Breakers</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="navbar">
  <div class="logo">
    <span class="brand">HEAD BREAKERS</span>
    <span class="server">WizeFA · FiveM</span>
  </div>

  <nav>
    <a href="index.html">Retour</a>
    <a href="#" class="btn-dark">Aide</a>
  </nav>
</header>

<main class="container">
  <section class="card">
    <span class="badge">🔐 Espace Motard</span>
    <h1>Connexion</h1>
    <p>Connecte-toi pour voir tes grades, ton évolution et les infos du club.</p>

    <form class="form">
      <label>
        Pseudo
        <input type="text" placeholder="Ton pseudo FiveM" required />
      </label>

      <label>
        Code / Mot de passe
        <input type="password" placeholder="••••••••" required />
      </label>

      <div class="actions">
        <button type="submit" class="btn-red">Se connecter</button>
        <a href="index.html" class="btn-dark">Annuler</a>
      </div>
    </form>
  </section>
</main>

</body>
</html>
